<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitbash Overzicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Black+Ops+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: werkbank met drie bakken (fases) naast elkaar; cursisten zijn genummerde onderdelen zoals op een gietraam. */
/* Stijl: snijmat op de werkbank. Bewust één vaste look (donkergroene snijmat, lichte styreen kaarten), in beide thema's gelijk. */
:root {
  color-scheme: light;
  --mat: #33634f;          /* snijmat */
  --mat-deep: #1d3b2e;
  --on-mat: #f0eadb;       /* tekst op de mat */
  --on-mat-muted: #b4c6bb;
  --bg: #e7e3d8;           /* styreen kaart */
  --surface: #f6f2e7;      /* papier */
  --fg: #1b1d1a;           /* inkt */
  --ink: #1b1d1a;
  --muted: #565a52;
  --line: #a9a597;
  --accent: #f2c230;       /* tape-geel */
  --tape: #eadfbf;         /* afplaktape */
  --p1: #a8740f;  --p1-soft: #f3e3bb;   /* bedenken: oker */
  --p2: #36678a;  --p2-soft: #d5e2ec;   /* samenstellen: primer-blauw */
  --p3: #c0441b;  --p3-soft: #f6d5c6;   /* afwerken: roest */
  --hard: 3px 3px 0 #0d1712;
  --shadow: var(--hard);
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
  --f-stencil: "Black Ops One", "Barlow Condensed", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 32px 32px; background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; background: var(--bg); opacity: .82; pointer-events: none; z-index: -1; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 22px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: "Rubik Dirt", var(--f-display); font-weight: 400; font-size: clamp(32px, 5.5vw, 50px); line-height: 1.05; margin: 4px 0 0; letter-spacing: .01em; text-wrap: balance; }
.btn {
  font: 600 14px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:focus-visible, .card:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; }

/* Voortgangsstrook */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bar span { transition: flex-grow .3s ease; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
.legend b { font-family: var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Bakken */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto auto; column-gap: 16px; row-gap: 0; align-items: start; }
@media (max-width: 820px) { .board { grid-template-columns: 1fr; grid-template-rows: none; row-gap: 16px; } }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto 1fr; min-height: 180px; }
@supports (grid-template-rows: subgrid) { @media (min-width: 821px) { .col { grid-row: span 2; grid-template-rows: subgrid; row-gap: 0; } } }
.col-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.col-head .tag { margin-top: 1px; font: 700 13px var(--f-mono); color: var(--surface); background: var(--c); border-radius: 3px; padding: 2px 7px; }
.col-head h2 { font: 600 17px var(--f-display); margin: 0; letter-spacing: .02em; }
.col-head .sub { font-size: 12px; color: var(--muted); }
.col-head .count { margin-left: auto; font: 600 14px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 12px; display: grid; gap: 10px; align-content: start; min-height: 120px; border-radius: 0 0 8px 8px; transition: background .15s; }
.list.over { background: var(--soft); }
.empty-col { font-size: 13px; color: var(--muted); padding: 14px 6px; text-align: center; border: 1px dashed var(--line); border-radius: 6px; }

.card {
  position: relative; background: var(--bg); border: 1px solid var(--line); border-left: 4px solid var(--c);
  border-radius: 6px; padding: 10px 12px 10px 12px; box-shadow: var(--shadow); cursor: pointer;
  display: grid; grid-template-columns: auto minmax(0,1fr); column-gap: 10px; row-gap: 4px;
}
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .4; }
.part { font: 600 11px var(--f-mono); color: var(--c); border: 1.5px solid var(--c); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; grid-row: span 2; align-self: start; }
.name { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.project { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.note { grid-column: 1 / -1; font-size: 13px; background: var(--soft); border-radius: 4px; padding: 6px 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
.meta { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.age { font: 400 11px var(--f-mono); color: var(--muted); }
.age.stale { color: var(--p3); font-weight: 600; }
.moves { display: flex; gap: 4px; }
.mv { font: 600 13px var(--f-mono); width: 30px; height: 28px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.mv:hover:not([disabled]) { border-color: var(--c); color: var(--c); }
.mv[disabled] { opacity: .3; cursor: default; }

.p1 { --c: var(--p1); --soft: var(--p1-soft); }
.p2 { --c: var(--p2); --soft: var(--p2-soft); }
.p3 { --c: var(--p3); --soft: var(--p3-soft); }

.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--p3); }

/* Bewerken */
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 0; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10,15,10,.45); }
dialog form { padding: 20px; display: grid; gap: 14px; }
dialog h3 { margin: 0; font: 600 20px var(--f-display); }
label { display: grid; gap: 5px; font-size: 12px; font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, textarea, select { font: 400 15px var(--f-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; text-transform: none; letter-spacing: 0; }
textarea { min-height: 80px; resize: vertical; }
.phase-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.phase-pick label { text-transform: none; letter-spacing: 0; font: 500 13px var(--f-body); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.phase-pick input { width: auto; margin: 0; accent-color: var(--c); }
.phase-pick label:has(input:checked) { border-color: var(--c); background: var(--soft); }
.actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.actions .right { display: flex; gap: 8px; }
.btn.danger { color: var(--p3); }
.btn.danger.armed { background: var(--p3); color: var(--surface); border-color: var(--p3); }

/* Foto's: versie 1-3 */
.shots { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.shot { position: relative; display: block; padding: 0; border: 0; border-radius: 4px; overflow: hidden; aspect-ratio: 1 / 1; max-width: 100%; background: var(--soft); cursor: zoom-in; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.shot .v { position: absolute; left: 4px; top: 4px; font: 600 10px var(--f-mono); letter-spacing: .04em; color: var(--surface); background: var(--c); border-radius: 3px; padding: 1px 5px; }
.shot.empty { cursor: default; background: transparent; border: 1px dashed var(--line); display: grid; place-items: center; font: 400 11px var(--f-mono); color: var(--muted); }
.shot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#viewer { width: min(900px, calc(100vw - 32px)); background: var(--surface); }
#viewer .vbody { display: grid; gap: 10px; padding: 12px; }
#viewer img { width: 100%; max-height: 75vh; object-fit: contain; border-radius: 4px; background: var(--bg); }
#viewer .vcap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; font-size: 14px; }
#viewer .vnav { display: flex; gap: 6px; }
.foto-field { display: grid; gap: 8px; }
.foto-prev { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border: 1px dashed var(--line); border-radius: 6px; background: var(--bg); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.foto-prev img { width: 100%; height: 100%; object-fit: cover; }
.foto-prev:has(img) { padding: 0; border-style: solid; }
.foto-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.foto-btns input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.foto-hint { font-size: 12px; color: var(--muted); }
.foto-hint.err { color: var(--p3); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { position: relative; display: grid; gap: 6px; align-content: start; min-width: 0; }
.slot-t { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.slot-prev { aspect-ratio: 1 / 1; max-width: 100%; border: 1px dashed var(--line); border-radius: 6px; background: var(--bg); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 12px; text-align: center; }
.slot-prev img { width: 100%; height: 100%; object-fit: cover; }
.slot-prev:has(img) { border-style: solid; }
.slot .btn.sm, .slot label.btn.sm { display: inline-flex; justify-content: center; padding: 6px 6px; font: 600 13px var(--f-body); text-transform: none; letter-spacing: 0; color: var(--fg); }
.slot .btn.sm.danger { color: var(--p3); }
.slot input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Fase-tabs: alleen op de telefoon */
.tabs { display: none; }
@media (max-width: 820px) {
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 8px; margin-block: -8px; background: var(--bg); }
  .tab { font: 600 13px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-bottom: 3px solid var(--line); border-radius: 6px; padding: 8px 4px; min-height: 44px; display: grid; justify-items: center; gap: 1px; cursor: pointer; }
  .tab .tn { font: 700 11px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
  .tab .tc { font: 600 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] { background: var(--soft); border-color: var(--c); border-bottom-color: var(--c); }
  .tab[aria-selected="true"] .tn, .tab[aria-selected="true"] .tc { color: var(--c); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .col.off { display: none; }
}
/* ===== Stijl: stoer · kitbash · knutsel ===== */
body {
  background-color: var(--mat); color: var(--on-mat); font-family: var(--f-body);
  background-image:
    linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
}
body::before { display: none; }

/* Kop met liniaal eronder */
header { padding-bottom: 22px; background:
  repeating-linear-gradient(90deg, rgba(240,234,219,.75) 0 2px, transparent 2px 50px) left bottom / 100% 14px no-repeat,
  repeating-linear-gradient(90deg, rgba(240,234,219,.45) 0 1px, transparent 1px 10px) left bottom / 100% 7px no-repeat,
  linear-gradient(rgba(240,234,219,.75), rgba(240,234,219,.75)) left bottom / 100% 2px no-repeat; }
h1 { color: var(--on-mat); text-shadow: 3px 3px 0 var(--mat-deep); letter-spacing: .02em; }
.stand { font: 600 12px var(--f-mono); color: var(--ink); background: var(--tape); padding: 4px 12px; transform: rotate(1.5deg); box-shadow: 2px 2px 0 rgba(0,0,0,.35);
  clip-path: polygon(0 8%, 3% 0, 97% 4%, 100% 0, 99% 92%, 100% 100%, 2% 96%, 0 100%); }
.status { color: var(--on-mat-muted); }
.status.err { color: #ffa27e; }

/* Knoppen: dik omlijnd, harde schaduw, indrukken bij klikken */
.btn { font: 700 15px var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink); background: var(--surface);
  border: 2px solid var(--ink); border-radius: 4px; padding: 8px 14px; box-shadow: var(--hard); transition: transform .08s, box-shadow .08s; }
.btn:hover { border-color: var(--ink); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #0d1712; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0d1712; }
.btn.primary { background: var(--accent); border-color: var(--ink); color: var(--ink); }
.btn.danger { color: var(--p3); }
.btn.danger.armed { background: var(--p3); color: #fff; border-color: var(--ink); }
.btn[disabled] { box-shadow: none; transform: none; }
:focus-visible { outline: 3px solid var(--accent) !important; outline-offset: 2px !important; }
dialog :focus-visible { outline-color: var(--ink) !important; }

/* Voortgangsstrook */
.summary { color: var(--fg); background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; box-shadow: var(--hard); }
.bar { height: 16px; border: 2px solid var(--ink); border-radius: 2px;
  background: repeating-linear-gradient(-45deg, #d8d3c4 0 6px, #ece8dc 6px 12px); }
.legend { color: var(--muted); font-weight: 500; }
.legend b { color: var(--ink); }
.dot { border: 1.5px solid var(--ink); border-radius: 1px; }

/* Kolommen: bakjes op de snijmat, met snijlijn */
.col { background: rgba(9,18,13,.38); border: 2px dashed rgba(240,234,219,.38); border-radius: 6px; }
.col-head { color: var(--on-mat); border-bottom: 2px dashed rgba(240,234,219,.38); padding: 14px 14px 12px; }
.col-head h2 { font: 700 21px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--on-mat); }
.col-head .sub { color: var(--on-mat-muted); font-size: 13px; margin-top: 2px; }
.col-head .count { color: var(--on-mat); font-size: 16px; }
.col-head .tag { font: 400 16px/1 var(--f-stencil); color: #fff; background: var(--c); border-radius: 0; padding: 5px 9px 4px; margin-top: 0;
  transform: rotate(-4deg); box-shadow: 2px 2px 0 #0d1712; clip-path: polygon(0 4%, 6% 0, 94% 6%, 100% 0, 97% 50%, 100% 100%, 5% 95%, 0 100%, 3% 50%); }
.list.over { background: rgba(240,234,219,.10); }
.empty-col { color: var(--on-mat-muted); border: 2px dashed rgba(240,234,219,.25); border-radius: 4px; }

/* Kaarten: onderdeel aan een gietraam */
.card { color: var(--fg); background: var(--bg); border: 2px solid var(--ink); border-left: 8px solid var(--c); border-radius: 4px; box-shadow: var(--hard); }
.card[draggable="true"]:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #0d1712; }
.part { position: relative; font: 600 11px var(--f-mono); color: var(--ink); background: var(--soft); border: 2px solid var(--c); width: 32px; height: 32px; }
.part::before { content: ""; position: absolute; right: 100%; top: 50%; width: 12px; height: 4px; background: var(--c); transform: translateY(-50%); }
.name { font: 700 17px/1.2 var(--f-display); letter-spacing: .02em; }
.project { color: var(--muted); font-size: 14px; }
.note { background: var(--soft); border-radius: 2px; border-left: 3px solid var(--c); font-size: 14px; }
.age { color: var(--muted); }
.age.stale { color: var(--p3); }
.mv { border: 2px solid var(--ink); border-radius: 3px; background: var(--surface); color: var(--ink); box-shadow: 2px 2px 0 #0d1712; }
.mv:hover:not([disabled]) { background: var(--c); color: #fff; border-color: var(--ink); }
.mv:active:not([disabled]) { transform: translate(2px, 2px); box-shadow: none; }
.mv[disabled] { box-shadow: none; }

/* Foto's */
.shot { border: 2px solid var(--ink); border-radius: 3px; }
.shot .v { color: #fff; background: var(--ink); border-radius: 2px; }
.shot.empty { border: 2px dashed var(--line); color: var(--muted); }

/* Vensters met waarschuwingsstreep */
dialog { color: var(--fg); background: var(--surface); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 6px 6px 0 #0d1712; }
dialog::backdrop { background: rgba(8,16,12,.6); }
dialog form, #viewer .vbody { background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--ink) 10px 20px) top / 100% 8px no-repeat; }
dialog form { padding-top: 26px; }
#viewer .vbody { padding-top: 20px; }
dialog h3 { font: 700 26px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
input, textarea, select { background: #fffdf6; border: 2px solid var(--ink); border-radius: 4px; }
.phase-pick label { border: 2px solid var(--ink); border-radius: 4px; font-weight: 600; }
.phase-pick label:has(input:checked) { background: var(--soft); border-color: var(--c); box-shadow: 2px 2px 0 var(--c); }
.slot-prev { border: 2px dashed var(--line); border-radius: 4px; }
.slot-prev:has(img) { border: 2px solid var(--ink); }
.slot .btn.sm, .slot label.btn.sm { font: 700 14px var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--ink); box-shadow: 2px 2px 0 #0d1712; }
.slot .btn.sm.danger { color: var(--p3); }
#viewer .vcap { font-weight: 600; }
#viewer img { border: 2px solid var(--ink); }

/* Fase-tabs (telefoon) */
@media (max-width: 820px) {
  .tabs { background: var(--mat); }
  .tab { color: var(--ink); background: var(--surface); border: 2px solid var(--ink); border-bottom-width: 2px; border-radius: 4px; box-shadow: var(--hard); font: 700 15px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
  .tab .tn { font: 400 12px var(--f-stencil); color: var(--c); letter-spacing: .06em; }
  .tab .tc { color: var(--muted); text-transform: none; letter-spacing: 0; }
  .tab[aria-selected="true"] { background: var(--c); border-color: var(--ink); border-bottom-color: var(--ink); color: #fff; transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0d1712; }
  .tab[aria-selected="true"] .tn, .tab[aria-selected="true"] .tc { color: #fff; }
  .wrap { padding-inline: 16px; }
}
/* Passend houden op smalle schermen */
.slot > * { min-width: 0; max-width: 100%; }
.slot .btn.sm, .slot label.btn.sm { font-size: 12px; letter-spacing: 0; padding: 5px 4px; white-space: normal; text-align: center; }
@media (max-width: 820px) {
  .tab { font-size: 13px; letter-spacing: 0; min-width: 0; padding-inline: 2px; }
  .tab > span { max-width: 100%; overflow-wrap: anywhere; }
}
@media (prefers-reduced-motion: reduce) { .btn, .mv, .card, .tab { transition: none !important; } .btn:hover, .card[draggable="true"]:hover { transform: none; } }
/* Logo in de kop */
.brand { display: grid; gap: 10px; justify-items: start; min-width: 0; }
.logo { display: block; height: 46px; width: auto; max-width: 100%; }
.header-side { display: grid; gap: 12px; justify-items: end; }
@media (max-width: 820px) {
  .logo { height: 36px; }
  header { align-items: stretch; }
  .header-side { width: 100%; justify-items: start; }
}

/* Bewerkbare Netlify-versie */
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.header-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.alleen-lezen .card { cursor: default; }
.code-uitleg { margin: 0; font-size: 14px; color: var(--muted); max-width: 46ch; }

(function () {
  const PHASES = [
    { id: "bedenken", code: "1", short: "Bedenken", title: "Bedenken / verzamelen", sub: "idee, referenties, onderdelen verzamelen", cls: "p1" },
    { id: "samenstellen", code: "2", short: "Samenstellen", title: "Samenstellen & in elkaar zetten", sub: "passen, zagen, lijmen, vullen, schuren", cls: "p2" },
    { id: "afwerken", code: "3", short: "Afwerken", title: "Afwerken & schilderen", sub: "primer, verf, weathering, decals", cls: "p3" },
  ];
  const VERSIES = [1, 2, 3];

  const fmtDag = s => { const d = new Date(s); return isNaN(d) ? "" : d.getDate() + " " + MAANDEN[d.getMonth()] + " " + d.getFullYear(); };
  const tijd = d => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const opslag = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

  let rows = [];
  let live = false;        // true = gegevens komen uit Supabase en kunnen worden bewerkt
  let editing = null;
  const pending = {};      // per versie: undefined = ongewijzigd, "" = verwijderen, data-URL = nieuw

  function setStatus(t, err) { const s = $("status"); s.textContent = t || ""; s.hidden = !t; s.classList.toggle("err", !!err); }

  /* ---------- Supabase ---------- */
  const geconfigureerd = () => /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;
  async function api(pad, opts = {}) {

      // Oude "anon"-sleutels (eyJ…) gaan ook mee als Bearer; nieuwe "sb_publishable_"-sleutels alleen als apikey.
      headers: Object.assign({ apikey: SUPABASE_KEY }, /^eyJ/.test(SUPABASE_KEY) ? { Authorization: "Bearer " + SUPABASE_KEY } : {}, opts.headers || {}),
    }));
    const tekst = await res.text();
    let data = null; try { data = tekst ? JSON.parse(tekst) : null; } catch (e) { data = tekst; }
    if (!res.ok) {
      const msg = (data && (data.message || data.error || data.msg)) || ("HTTP " + res.status);
      const err = new Error(msg); err.status = res.status;
      if (/klascode onjuist/i.test(msg)) err.badcode = true;

  }
  const rpc = (naam, args) => api("/rest/v1/rpc/" + naam, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args) });

  async function laden(stil) {
    if (!geconfigureerd()) return reserve("De online opslag is nog niet ingesteld. Je ziet de stand van " + fmtDag(STAND) + "; wijzigen kan nog niet.");
    try {
      const data = await api("/rest/v1/cursisten?select=*&order=nummer.asc");
      rows = Array.isArray(data) ? data : [];
      live = true;
      $("stand").textContent = "Live · bijgewerkt " + tijd(new Date());
      render();
      if (!stil) setStatus(rows.length ? "" : "Nog geen cursisten. Voeg de eerste toe met de knop bovenaan.");
    } catch (e) {
      if (live && stil) return;   // een gemiste verversing: houd wat er staat

  function reserve(melding) {

  const iemandBewerkt = () => $("dlg").open || $("codeDlg").open;

  /* ---------- Klascode ---------- */
  const CODE_KEY = "kitbash-klascode";
  let codeResolve = null;
  function vraagCode(fout) {
    return new Promise(resolve => {
      codeResolve = resolve;
      $("fCode").value = ""; $("codeErr").hidden = !fout; $("codeErr").textContent = fout || "";
      $("codeOk").disabled = false; $("codeDlg").showModal(); $("fCode").focus();
    });
  }
  $("codeForm").addEventListener("submit", async e => {
    e.preventDefault();
    const code = $("fCode").value.trim(); if (!code) return;
    $("codeOk").disabled = true; $("codeErr").hidden = true;

      const ok = await rpc("controleer_code", { p_code: code });

    }

  });
  function codeAfbreken() { $("codeDlg").close(); const r = codeResolve; codeResolve = null; r && r(null); }
  $("codeCancel").addEventListener("click", codeAfbreken);
  $("codeDlg").addEventListener("cancel", e => { e.preventDefault(); codeAfbreken(); });
  async function klascode() { return opslag.get(CODE_KEY) || await vraagCode(); }

  // Voert een schrijfactie uit met de klascode; vraagt opnieuw als de code niet (meer) klopt.
  async function metCode(actie) {
    let code = await klascode(); if (!code) return { afgebroken: true };
    try { return { data: await actie(code) }; }
    catch (e) {
      if (!e.badcode) throw e;
      opslag.set(CODE_KEY, null);
      code = await vraagCode("De opgeslagen klascode klopt niet meer. Vul de nieuwe code in.");
      if (!code) return { afgebroken: true };
      return { data: await actie(code) };
    }
  }

  /* ---------- Foto's ---------- */
  const fotoVan = (r, n) => (r && r["foto" + n]) || "";
  function shrink(file) {   // max. 1600 px, JPEG, onder ca. 600 kB
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        let max = 1600, q = 0.82, out = "";
        for (let i = 0; i < 6; i++) {
          const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement("canvas");
          c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 800000) break;
          max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.06);

    });
  }
  async function uploadFoto(dataUrl) {
    const blob = await (await fetch(dataUrl)).blob();
    const naam = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + ".jpg";
    await api("/storage/v1/object/fotos/" + naam, { method: "POST", headers: { "Content-Type": "image/jpeg", "x-upsert": "false" }, body: blob });
    return SUPABASE_URL.replace(/\/$/, "") + "/storage/v1/object/public/fotos/" + naam;
  }

  // Groot bekijken
  let vList = [], vPos = 0, vName = "";
  function showPhoto(r, n) {
    vName = (r.naam || "Cursist") + (r.project ? " – " + r.project : "");
    vList = VERSIES.filter(k => fotoVan(r, k)).map(k => ({ n: k, src: fotoVan(r, k) }));
    vPos = Math.max(0, vList.findIndex(x => x.n === n));
    vShow(); if (!$("viewer").open) $("viewer").showModal();
  }
  function vShow() {
    const it = vList[vPos]; if (!it) return;
    $("vImg").src = it.src; $("vImg").alt = "Versie " + it.n + " van " + vName;
    $("vCap").textContent = "Versie " + it.n + " · " + vName;
    const many = vList.length > 1; $("vPrev").hidden = !many; $("vNext").hidden = !many;
  }
  function vStep(d) { if (vList.length < 2) return; vPos = (vPos + d + vList.length) % vList.length; vShow(); }
  $("vPrev").addEventListener("click", () => vStep(-1));
  $("vNext").addEventListener("click", () => vStep(1));
  $("viewer").addEventListener("keydown", e => { if (e.key === "ArrowLeft") vStep(-1); if (e.key === "ArrowRight") vStep(1); });
  $("vClose").addEventListener("click", () => $("viewer").close());
  $("viewer").addEventListener("click", e => { if (e.target === $("viewer")) $("viewer").close(); });
  function photosEl(r) {

  /* ---------- Weergave ---------- */

    const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    const t = d <= 0 ? "vandaag bijgewerkt" : d === 1 ? "gisteren bijgewerkt" : d + " dagen geleden bijgewerkt";
    return { t, stale: d >= 14 };
  }

  // Fase-tabs (telefoon)
  let gekozen = opslag.get("kitbash-fase");
  if (!PHASES.some(p => p.id === gekozen)) gekozen = "bedenken";
  const tabs = PHASES.map((p, i) => {
    const t = document.createElement("button"); t.type = "button"; t.className = "tab " + p.cls;
    t.setAttribute("role", "tab"); t.setAttribute("aria-controls", "fase-" + p.id); t.id = "tab-" + p.id;
    const tn = document.createElement("span"); tn.className = "tn"; tn.textContent = "FASE " + p.code;
    const ts = document.createElement("span"); ts.textContent = p.short;
    const tc = document.createElement("span"); tc.className = "tc";
    t.append(tn, ts, tc);
    t.addEventListener("click", () => kies(p.id, true));
    t.addEventListener("keydown", e => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0; if (!d) return;

  });
  function kies(id, door) {

    document.querySelectorAll(".board .col").forEach(c => c.classList.toggle("off", c.dataset.phase !== id));
    if (door) {
      opslag.set("kitbash-fase", id);

  function render() {
    document.body.classList.toggle("alleen-lezen", !live);

      mine.forEach(r => ul.appendChild(card(r, pi)));

      }
      sec.appendChild(ul); board.appendChild(sec);
    });
    kies(gekozen, false);
  }

  function card(r, pi) {
    const li = document.createElement("li");
    li.className = "card"; li.dataset.id = r.id;
    const a = ago(r.bijgewerkt);
    li.innerHTML = '<span class="part"></span><div class="name"></div><div class="project"></div>' +
      (r.notitie ? '<div class="note"></div>' : "") +
      '<div class="meta"><span class="age"></span><span class="moves"><button class="mv" type="button" data-d="-1" aria-label="Naar vorige fase">←</button><button class="mv" type="button" data-d="1" aria-label="Naar volgende fase">→</button></span></div>';
    li.querySelector(".part").textContent = String(r.nummer || "?").padStart(2, "0");
    li.querySelector(".name").textContent = r.naam || "Naamloos";

    const ag = li.querySelector(".age"); ag.textContent = a.t; ag.classList.toggle("stale", live && a.stale);

  /* ---------- Opslaan ---------- */
  function foutmelding(e) {

  }
  async function move(id, fase) {

      const res = await metCode(code => rpc("opslaan_cursist", { p_code: code, p_id: id, p_data: { fase } }));
      if (res.afgebroken) return;
      flash((r.naam || "Cursist") + " → " + PHASES[idx(fase)].title);
      await laden(true);
    } catch (e) { setStatus(foutmelding(e), true); }
  }

  // Bewerkvenster

    l.append(p.code + " · " + p.short);

  });
  const HINT = "Voeg per stap een foto toe: versie 1, 2 en 3.";
  function hint(t, err) { $("fFotoHint").textContent = t || HINT; $("fFotoHint").classList.toggle("err", !!err); }
  const slotSrc = n => pending[n] !== undefined ? pending[n] : fotoVan(editing, n);
  function buildSlots() {
    const box = $("fSlots"); box.innerHTML = "";
    VERSIES.forEach(n => {
      const src = slotSrc(n);
      const s = document.createElement("div"); s.className = "slot";
      const t = document.createElement("span"); t.className = "slot-t"; t.textContent = "Versie " + n; s.appendChild(t);
      const pv = document.createElement("div"); pv.className = "slot-prev";
      if (src) { const i = document.createElement("img"); i.src = src; i.alt = "Versie " + n; pv.appendChild(i); } else pv.textContent = "Geen foto";
      s.appendChild(pv);

      const lab = document.createElement("label"); lab.className = "btn sm"; lab.htmlFor = inp.id; lab.textContent = src ? "Wijzigen" : "Toevoegen";
      s.appendChild(lab); s.appendChild(inp);

        s.appendChild(del);

  }
  function openEdit(r) {
    if (!live) return;

    $("dlgTitle").textContent = r ? "Cursist bewerken" : "Cursist toevoegen";

    $("fProject").value = r ? r.project || "" : "";

  $("addBtn").addEventListener("click", () => openEdit(null));
  $("cancelBtn").addEventListener("click", () => $("dlg").close());
  $("delBtn").addEventListener("click", async () => {
    const b = $("delBtn");

    const r = editing; if (!r) return;

      const res = await metCode(code => rpc("verwijder_cursist", { p_code: code, p_id: r.id }));

  $("form").addEventListener("submit", async e => {

    const r = editing;
    $("saveBtn").disabled = true; $("saveBtn").textContent = "Opslaan…";
    try {
      const res = await metCode(async code => {
        // Eerst de klascode controleren, dan pas foto's uploaden
        if (!(await rpc("controleer_code", { p_code: code }))) { const err = new Error("klascode onjuist"); err.badcode = true; throw err; }
        for (const n of VERSIES) {
          if (pending[n] === undefined) continue;
          if (pending[n] === "") { data["foto" + n] = ""; continue; }
          if (/^https:\/\//.test(pending[n])) { data["foto" + n] = pending[n]; continue; }   // al geüpload bij een eerdere poging
          hint("Versie " + n + " uploaden…");
          data["foto" + n] = await uploadFoto(pending[n]);
          pending[n] = data["foto" + n];
        }
        return rpc("opslaan_cursist", { p_code: code, p_id: r ? r.id : null, p_data: data });
      });
      if (res.afgebroken) { hint(); }
      else { $("dlg").close(); flash(r ? "Opgeslagen" : data.naam + " toegevoegd"); await laden(true); }
    } catch (err) { hint(foutmelding(err), true); }
    $("saveBtn").disabled = false; $("saveBtn").textContent = "Opslaan";
  });

  laden();
})();
</script>
</body>
</html>
